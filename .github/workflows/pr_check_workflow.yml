name: Lint & Security Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fetch base and head commits
        run: |
          git fetch --no-tags --prune origin \
            +${{ github.event.pull_request.base.sha }}:refs/remotes/origin/pr-base \
            +${{ github.event.pull_request.head.sha }}:refs/remotes/origin/pr-head

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff on changed files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/pr-base origin/pr-head | grep '\.py$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files changed."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          ruff check $CHANGED_FILES

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Fetch base and head commits
        run: |
          git fetch --no-tags --prune origin \
            +${{ github.event.pull_request.base.sha }}:refs/remotes/origin/pr-base \
            +${{ github.event.pull_request.head.sha }}:refs/remotes/origin/pr-head

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit on changed files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/pr-base origin/pr-head | grep '\.py$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files changed."
            exit 0
          fi

          echo "Scanning changed files:"
          echo "$CHANGED_FILES"
          bandit -v $CHANGED_FILES
