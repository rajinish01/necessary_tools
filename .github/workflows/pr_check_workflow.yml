name: Lint & Security Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  setup:
    name: Compute Fetch Depth
    runs-on: ubuntu-latest
    outputs:
      fetch_depth: ${{ steps.depth.outputs.fetch_depth }}
    steps:
      - name: Compute fetch depth
        id: depth
        run: echo "fetch_depth=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "$GITHUB_OUTPUT"

  ruff:
    name: Ruff Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.setup.outputs.fetch_depth }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff on changed files
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py')

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files changed."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          ruff check $CHANGED_FILES

  bandit:
    name: Bandit Security Scan
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ needs.setup.outputs.fetch_depth }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit on changed files
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py')

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files changed."
            exit 0
          fi

          echo "Scanning changed files:"
          echo "$CHANGED_FILES"
          bandit $CHANGED_FILES
