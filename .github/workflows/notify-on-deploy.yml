name: Notify Teams

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  send-jira-summary:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Jira ticket IDs from merged commits
        id: extract
        run: |
          git log --pretty=format:"%s" ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} > commit_messages.txt

          # Restrict to known project prefixes to avoid false positives.
          # Add/remove prefixes here as needed.
          PREFIXES="ER|ST|CS|TE|TS"

          TICKETS=$(grep -oE "(${PREFIXES})-[0-9]+" commit_messages.txt | sort -u -t- -k2,2n)

          if [ -z "$TICKETS" ]; then
            TICKET_LINKS="No Jira ticket references found in commit messages."
          else
            TICKET_LINKS=$(echo "$TICKETS" | sed 's|^|https://eshipz.atlassian.net/browse/|')
          fi

          echo "Extracted tickets:"
          echo "$TICKET_LINKS"

          {
            echo "tickets<<EOF"
            echo "$TICKET_LINKS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure AWS CLI is installed
        run: |
          if ! command -v aws &> /dev/null; then
            echo "AWS CLI not found, installing..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
          else
            echo "AWS CLI already installed: $(aws --version)"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build email body file
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TICKETS: ${{ steps.extract.outputs.tickets }}
        run: |
          SUBJECT="Jira tickets merged from ${SOURCE_BRANCH} into ${BASE_BRANCH}"
          BODY_TEXT="Hi Team,

          Jira tickets included in this release:
          ${TICKETS}

          Source PR: ${PR_URL}"

          jq -n \
            --arg subject "$SUBJECT" \
            --arg body "$BODY_TEXT" \
            '{
              Simple: {
                Subject: { Data: $subject },
                Body: { Text: { Data: $body } }
              }
            }' > body.json

          echo "Generated body.json:"
          cat body.json

      - name: Send summary email via SES CLI
        run: |
          CLEAN_TO_ADDRESSES=$(echo "${{ vars.TO_ADDRESSES }}" | tr -d '[:space:]')

          aws sesv2 send-email \
            --from-email-address "support@eshipz.com" \
            --destination "ToAddresses=${CLEAN_TO_ADDRESSES}" \
            --content file://body.json
